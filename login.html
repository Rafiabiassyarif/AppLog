<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk — Kroombox</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/public.css"></head><body class="login-page"><a class="brand login-brand" href="/"><span class="brand-mark">K</span><strong>Kroombox / apps</strong></a><main class="login-layout"><section class="login-story"><p class="hero-kicker">ONE WORKSPACE. EVERY CREATION.</p><h1>Tempat karya<br>kita <em>bertemu.</em></h1><p>Lanjutkan ide, catat progres, dan lihat apa yang sedang dibangun bersama.</p><div class="login-art">K<span>✦</span></div></section><section class="login-panel"><p class="eyebrow">WORKSPACE KROOMBOX</p><h2 id="authTitle">Selamat datang kembali.</h2><p id="authDescription">Masuk dengan akun dari admin Kroombox.</p><form id="authForm"><label class="field" id="nameField" hidden>Nama admin<input name="name" autocomplete="name" maxlength="60"></label><label class="field">Username<input name="username" required pattern="[a-zA-Z0-9_.-]{3,40}" autocomplete="username" placeholder="Username kamu"></label><label class="field">Password<input name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password" placeholder="Minimal 8 karakter"></label><p id="authError" role="status"></p><button class="button button-primary" id="authSubmit">Masuk workspace ↗</button></form><p class="login-help">Butuh akun? Hubungi admin Kroombox.</p><a href="/" class="nav-link">← Kembali ke beranda</a></section></main><script src="/auth.js"></script></body></html>
